- Name: corpus
  Title: Assess — CIMT Bonn cycling (de)
  source: cimt:Cycling-Dialogue-Bonn+Survey-Bonn
  phrases:
  - Fahrradstraßen in der Innenstadt
  - Von der markierten Ecke der Innenstadt kommt man grundsätzlich nicht gut in Richtung
    Osten (Adenauerallee/Belderberg).
  - Über Regina-Pacis-Weg und Fußgängerampel ist sehr unpraktisch, aber Franziskanerstraße
    und Rathausgasse funktionieren auch nicht.
  - Könnte man aus mehreren Straßen der Innenstadt (Am Hof, Rathausgasse, Wesselstraße,
    Am Neutor) nicht beidseitig geöffnete Fahrradstraßen machen?
  - Radweg trifft auf Straße
  - Hier wäre eine breite Einmündung ohne Bordsteinkante und Poller von Vorteil, eine
    Vorfahrt für Radfahrer*innen sinvoll, da dies eine stark befahrene Pendlerstrecke
    ist.
  - Engstelle führt direkt auf Gleise
  - Diese Stelle ist auch wenig optimal, wenn man aus der Unterführung kommt.
  - Es ist eng, unklar ob Fuß- oder Radweg, danach sofort Straßenbahnschienen.
  - Die Anbindung an das Beueler Zentrum auch wenig angenehm zu fahren durch die Obere
    Wilhelmsstraße.
  - Gefährliche Einmündung
  - Eventuell würden Spiegel oder eine bessere Sicht die Situation entschärfen.
  - Radwege neben den Gleisen
  - Wegen der Straßenbahnschienen ist das Radfahren auf der Friedrich-Breuer-Straße
    sehr gefahrenträchtig.
  - Wenn man die Geschäfte erreichen will, ist es leider nicht möglich auf die Nebenstraßen
    auszuweichen.
  - Würden die Parkplätze entlang der Friedrich-Breuer-Straße entfernt, würde genug
    Platz für Radschutzstreifen neben den Gleisen entstehen.
  - Radverbindung in der Innenstadt
  - Von ca. Mitte November bis zum 24.12. jeden Jahres ist die zentrale Fahrradroute
    durch die Stadt relativ ersatzlos gesperrt.
  - Alternativen bzw. Umleitung sind nur bedingt bis gar nicht ausgewiesen.
  - Es gab vor Jahr und Tag einen Vorschlag der Grünen, einen Radweg freizuhalten.
  - Warum nicht vom Friedensplatz über den Bottlerplatz zur Münsterstraße und dann
    durch die Sürst über den Markt einen Weg freihalten?
  - Ampel auf Radweg
  - Schwierige Situation.
  - Sollen Radler*innen hier wirklich warten müssen?
  - Der Fußgänger*innenverkehr hält sich in Grenzen.
  - Parken in zweiter Reihe
  - Auf der Prinz-Albert-Straße parken regelmäßig Autos in zweiter Reihe.
  - Als Fahrradfahrer muss man in diesem Fall in den Gleisbereich der Straßenbahn
    ausweichen, was nicht ungefährlich ist.
  - Auffahrt auf den Südbrücke vom Rhein
  - Genauso wie an der Nordbrücke kann direkt vom Rheinuferweg ein Weg bzw. eine Auffahrt
    für den Radverkehr geschaffen werden.
  - Das würde den unschönen und lauten Umweg entlang der sehr langen Vorlandbrücke
    abkürzen und den Zugang zum Rheinufer erleichtern.
  - Bei ca. 8 % Steigung wäre es auch ähnlich wie an der Nordbrücke.
  - Fahrradweg fast immer zugeparkt
  - An dieser Stelle wird der Fahrradweg von der Straße auf den Gehweg geführt (in
    beide Richtungen).
  - In beide Richtungen ist hier der Radweg fast jeden Tag durch PKW zugeparkt.
  - Es müsste hier regelmäßige Kontrollen oder in letzter Instanz Poller oder sonstige
    Hindernisse geben, die Autofahrer vom Zuparken des Radweges abhalten.
  - Wichtige Stellplätze - leider häufig überfüllt
  - Die Fahrradparkmöglichkeiten erweitern.
  - Überfüllte Fahrradständer
  - Mehr Stellplätze.
  - Geradlinige Wegführung!
  - An Ampelübergängen kreuzt sich der Rad- & Fußgängerweg.
  - Das gibt oft gefährliche Situationen
  - Grünanlage sollte mit Erde aufgefüllt werden + kompl. Bepflanzung so, daß keine
    Menschenansammlung stattfindet.
  - Wir hätten mehr Ruhe + Sicherheit!
  - Z.Zt. treffen sich alle Nationalitäten waschen Kleidungsstücke + Füße am Brunnen,
    füllen Flaschen auf und diehlen mit Drogen
  - Sanierung der Schule Gesamtschule
  - Radfahrern Verkehrsregeln vermitteln, von Bürgersteigen verbannen
  - Einrichtung eines Radweges
  - Überprüfung aller Kreisverkehre auf Fahrradfreundlichkeit
  - Breitere Radwege
  - Längere Grünphasen als Fußgänger Ampeln
  - Wenn ich den Radfahrweg Kölnstr. für auf dem Nordfriedhof bei grün überquere,
    kommen mir Radfahrer von rechts mit sehr hohem Tempo vorbeigefahren.
  - Deshalb finde ich es für notwendig, daß Radfahrer, wie bei PKW's, bei Rot hier
    anhalten müßten, da alte Person verletzt werden
  - Das gleiche zählt auch auf der Kölnstr., wenn ich die Straße überqueren will zum
    Haupteingang Nordfriedhof.
  - Deshalb Ampelschaltung
  - Radfahrweg mitten auf der Straße nicht gut!
  - Abgetrennte Radweg
  - Mehr Abstellmöglichkeiten explizit für Fahrräder zum Festketten
  - Halteverbot auf Radwegen
  - unebener Straßenbelag
  - Mehr Sicherheit für Fahrradfahrer
  - Radweg Richtung Bonn Innenstadt
  - Ampelschaltungen verbessern
  - z.B. legals Rechtsabbiegen bei rot oder extra Linksabbiegerstreifen
  - Das Stadtzentrum ist für Radfahrer schlecht zu befahren.
  - Um zum Bahnhof zu gelangen, müssen große Umwege gefahren werden
  - 'eigene Radwege oder Mitbenutzung der Straße statt geteiltem Rad- und Gehweg:
    Dieser wirkt breit, also parken die Autos drauf, und Fußgänger stehen immer im
    Weg, sodass man extrem langsam ist'
  - 'für Fahrräder akzeptable Baumaßnahmen: Kein erzwungenes Teilen eines Gehwegs
    von Fußgängern und Radfahrern beider Richtungen, 5-10 Min. zusätzlich (mit der
    doppelten Straßenüberquerung)'
  - Sichere, vlt. überdachte kostenlose Fahrradabstellmöglichkeiten am Hbf
  - Fahrbahn glatt gestalten
  - Verkehrsführung, Straße ist Einbahnstraße für Autofahrer mit Überholverbot.
  - Rad- und Bahn können Strecke in beide Richtunge nutzen.
  - Durch verbotenes Überholen Unfallgefahr
  - Radweg ausbessern/ sanieren und eindeutige Radwegeführung.
  - Unklar, ob Radweg am Ufer noch genutzt werden darf oder Straße
  - mehr seperate Radwege
  - Bessere Möglichkeit zum Fahrrad anschließen (also an Rahmen), nicht nur Ständer,
    die das Vorderrad anschließbar machen
  - Im Bonner Norden sind die überwiegenden Fahrradstrassen auf Kopfsteinpflaster.
  - Sie sollten fahrradgerecht asphaltiert sein
