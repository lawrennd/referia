[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "referia"
version = "0.2.0"
description = "Library for processing data using jupyter notebooks."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Neil D. Lawrence", email = "lawrennd@gmail.com" },
]
requires-python = ">=3.11,<4.0"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "XlsxWriter",
    "pandas",
    # spaCy 3.8 / Thinc 8.3; lynguine requires NumPy 2 (thinc#939 is resolved)
    "numpy>=2.0.0",
    "scikit-learn>=1.3",
    "jupyter",
    "matplotlib",
    "unidecode",
    "wordcloud",
    "thinc",
    "spacy>=3.8.0,<3.9.0",
    # spaCy model: https://github.com/explosion/spacy-models/releases/
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz",
    "pillow",
    "google-auth-oauthlib",
    "pypandoc",
    "pypdftk",
    "pdfannots",
    "lynguine[documents,parquet]",
    "gspread-pandas; sys_platform == 'darwin'",
    "appscript; sys_platform == 'darwin'",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "aiofiles",
]

[project.optional-dependencies]
distance = [
    "POT>=0.9.0",
]
# Install: pip install 'referia[llm]' or: uv sync --extra llm
llm = [
    "langchain>=1.3.9,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-anthropic>=1.4.6,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "openai>=2.26.0,<3",
    "anthropic>=0.96.0,<1.0.0",
    "tenacity>=9.0.0,<10",
    "diskcache>=5.6.0,<6",
    "python-dotenv>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/lawrennd/referia"

[project.scripts]
referia = "referia.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0,<7",
    "pytest-mock>=3.3.1,<4",
    "deepdiff>=8.6.2,<9",
]
docs = [
    "sphinx>=8.2.3,<9",
    "sphinx-rtd-theme>=3.0.2,<4",
    "myst-parser>=4.0.1,<5",
]

[tool.uv.sources]
lynguine = { git = "https://github.com/lawrennd/lynguine.git", branch = "main" }

[tool.hatch.metadata]
# Required for the spaCy model URL pin in project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["referia"]

[tool.pytest.ini_options]
testpaths = ["tests", "referia/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
