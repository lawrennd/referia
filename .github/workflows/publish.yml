name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v5

    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        uv sync --extra llm --group dev

    - name: Run tests
      run: |
        uv run pytest --cov=referia --cov-report=xml

    - name: Check version matches release tag
      run: |
        RELEASE_VERSION=${GITHUB_REF#refs/tags/v}
        PROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
          echo "Error: Release version $RELEASE_VERSION doesn't match project version $PROJECT_VERSION"
          exit 1
        fi
        echo "Version check passed: $RELEASE_VERSION"

    - name: Build package
      run: |
        uv build

    - name: Verify package contents
      run: |
        uvx twine check dist/*

    - name: Publish to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
