<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/style.css?v={{ cache_bust }}">
    <!--
        HTMX enables field-level AJAX updates without a full JS framework.
        TODO: vendor htmx.min.js into /static for offline use.
    -->
    <script src="https://unpkg.com/htmx.org@2.0.0" crossorigin="anonymous"></script>
    <!--
        MathJax typesets $...$ / $$...$$ in Markdown and HTMLMath widgets,
        matching Jupyter ipywidgets.HTMLMath.  Re-run after HTMX swaps.
        TODO: vendor for offline use (same as htmx above).
    -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async crossorigin="anonymous"></script>
    {% if needs_plotly %}
    <!-- Plotly.js for interactive viewer figures (CIP-0011). TODO: vendor for offline. -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js@2.35.2/dist/plotly.min.js" crossorigin="anonymous"></script>
    {% endif %}
    <script>
      /* Root-server mode: CONFIG_PATH is the URL prefix for this config (e.g.
         "/theses/examined/introduction").  In single-config mode it is empty.
         The htmx:configRequest listener prepends it to every HTMX request path
         so render.py never needs to know about path prefixes.             */
      (function() {
        var BASE = "{{ config_path_prefix | default('') }}";
        if (!BASE) return;
        document.addEventListener("htmx:configRequest", function(evt) {
          var path = evt.detail.path;
          if (path && path.charAt(0) === "/" && path.indexOf(BASE + "/") !== 0) {
            evt.detail.path = BASE + path;
          }
        });
      })();

      /* Long save / reload / populate: the bar stays empty until HTMX
         settles, so show an indeterminate progress state immediately. */
      function longOpLabel(path) {
        if (!path) return null;
        var clean = String(path).split("?")[0].replace(/\/+$/, "");
        var parts = clean.split("/");
        var last = parts[parts.length - 1] || "";
        var prev = parts[parts.length - 2] || "";
        if (last === "save") return "Saving\u2026";
        if (last === "reload") return "Reloading\u2026";
        if (prev === "populate-all") return "Updating all\u2026";
        if (prev === "populate") return "Working\u2026";
        if (prev === "generate-document") return "Creating document\u2026";
        if (prev === "generate-summary-document") return "Creating summary\u2026";
        if (prev === "edit-pdf") return "Preparing PDF\u2026";
        return null;
      }

      function requestPath(evt) {
        var cfg = evt.detail && evt.detail.requestConfig;
        if (cfg && cfg.path) return cfg.path;
        if (evt.detail && evt.detail.path) return evt.detail.path;
        return "";
      }

      function longOpDoneHtml(path) {
        if (!path) return null;
        var clean = String(path).split("?")[0].replace(/\/+$/, "");
        var last = clean.split("/").pop() || "";
        if (last === "reload") return '<span class="status-ok">\u2713 Reloaded</span>';
        return null;
      }

      function requestFailed(evt) {
        var d = evt.detail || {};
        if (d.failed) return true;
        if (d.successful === false) return true;
        var xhr = d.xhr;
        return !!(xhr && xhr.status >= 400);
      }

      function completeLongOpBar(evt) {
        var bar = document.getElementById("status-bar");
        if (!bar) return bar;
        bar.classList.remove("status-busy");
        var path = requestPath(evt);
        if (!longOpLabel(path)) return bar;
        var target = evt.detail && evt.detail.target;
        if (target && target.id === "status-bar") return bar;
        if (!bar.querySelector(".status-progress")) return bar;
        if (requestFailed(evt)) {
          bar.innerHTML = '<span class="status-error">Request failed. See server log.</span>';
        } else {
          bar.innerHTML = longOpDoneHtml(path) || "";
        }
        return bar;
      }

      document.addEventListener("htmx:beforeRequest", function (evt) {
        var label = longOpLabel(requestPath(evt));
        if (!label) return;
        var bar = document.getElementById("status-bar");
        if (!bar) return;
        clearTimeout(bar._timer);
        bar.classList.add("visible", "status-busy");
        bar.innerHTML =
          '<span class="status-progress" role="progressbar" aria-busy="true">' +
          label + "</span>";
        var btn = evt.detail.elt;
        if (btn && btn.disabled !== undefined &&
            (btn.classList.contains("save-button") ||
             btn.classList.contains("reload-button"))) {
          btn.disabled = true;
        }
      });

      /* Reload swaps #review-panel, not the bar — clear in-flight markup
         here as well as afterSettle, in case settle is skipped. */
      document.addEventListener("htmx:afterRequest", completeLongOpBar);

      /* Auto-show the status bar when HTMX writes to it, then fade after 3 s.
         If the fragment carries data-auto-download, start that download too
         (Create docx / Prepare PDF) — plain <a download> remains as fallback. */
      document.addEventListener("htmx:afterSettle", function (evt) {
        var bar = completeLongOpBar(evt);
        if (!bar) return;
        if (bar.innerHTML.trim() !== "") {
          bar.classList.add("visible");
          clearTimeout(bar._timer);
          bar._timer = setTimeout(function () {
            bar.classList.remove("visible");
          }, 3000);
          var auto = bar.querySelector("[data-auto-download]");
          if (auto) {
            var url = auto.getAttribute("data-auto-download");
            if (url) {
              var a = document.createElement("a");
              a.href = url;
              a.setAttribute("download", "");
              a.style.display = "none";
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            }
          }
        } else {
          bar.classList.remove("visible");
        }
      });

      document.addEventListener("htmx:sendError", function () {
        var bar = document.getElementById("status-bar");
        if (!bar) return;
        bar.classList.remove("status-busy");
        bar.classList.add("visible");
        bar.innerHTML = '<span class="status-error">Request failed.</span>';
      });

      /* PopulateButton loading state: dim the button and target textarea while
         the LLM request is in-flight.  JS is more reliable than CSS selectors
         that depend on HTMX internals (hx-disabled-elt, htmx-request class). */
      document.addEventListener("htmx:beforeRequest", function (evt) {
        var btn = evt.detail.elt;
        if (!btn.classList || !btn.classList.contains("populate-button")) return;
        btn.disabled = true;
        btn._populateLabel = btn.textContent;
        btn.textContent = btn._populateLabel + " \u2026";  /* " …" */
        var indicatorSel = btn.getAttribute("hx-indicator");
        if (indicatorSel) {
          var target = document.querySelector(indicatorSel);
          if (target) { target.style.opacity = "0.4"; target.style.transition = "opacity 0.15s"; }
        }
      });

      document.addEventListener("htmx:afterRequest", function (evt) {
        var btn = evt.detail.elt;
        if (!btn.classList) return;
        if (btn.classList.contains("save-button") ||
            btn.classList.contains("reload-button")) {
          btn.disabled = false;
        }
        if (!btn.classList.contains("populate-button")) return;
        btn.disabled = false;
        if (btn._populateLabel !== undefined) { btn.textContent = btn._populateLabel; }
        var indicatorSel = btn.getAttribute("hx-indicator");
        if (indicatorSel) {
          var target = document.querySelector(indicatorSel);
          if (target) { target.style.opacity = ""; }
        }
      });

      /* Measure sticky chrome heights and publish as CSS custom properties
         so panel-nav / panel-filters / viewer-col stay accurate without
         hard-coded pixel values.
         --header-height  : .site-header
         --nav-height     : .panel-nav
         --filters-height : .panel-filters (0 when absent)
         --sticky-offset  : sum (= where scrolling content starts)

         IMPORTANT: called via DOMContentLoaded (not immediately) so the body
         elements actually exist when the measurements are taken. */
      function updateStickyHeights() {
        var h = document.querySelector(".site-header");
        var n = document.querySelector(".panel-nav");
        var f = document.querySelector(".panel-filters");
        var hh = h ? h.offsetHeight : 0;
        var nh = n ? n.offsetHeight : 0;
        var fh = f ? f.offsetHeight : 0;
        var root = document.documentElement;
        root.style.setProperty("--header-height", hh + "px");
        root.style.setProperty("--nav-height",    nh + "px");
        root.style.setProperty("--filters-height", fh + "px");
        root.style.setProperty("--sticky-offset", (hh + nh + fh) + "px");
      }
      document.addEventListener("DOMContentLoaded", updateStickyHeights);
      window.addEventListener("resize", updateStickyHeights);
      /* Re-measure after HTMX swaps — the nav may change height after a reload */
      document.addEventListener("htmx:afterSettle", updateStickyHeights);

      /* Typeset LaTeX after HTMX replaces Markdown/HTMLMath fragments.
         Wait for MathJax startup so the first swap is not a no-op if the
         CDN script is still loading. */
      function typesetMath(root) {
        var target = root || document.body;
        function run() {
          if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([target]).catch(function () {});
          }
        }
        if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
          MathJax.startup.promise.then(run);
        } else {
          run();
        }
      }
      document.addEventListener("htmx:afterSettle", function (evt) {
        var el = (evt.detail && evt.detail.elt) ? evt.detail.elt : document.body;
        typesetMath(el);
      });

      /* Interactive Plotly viewers (CIP-0011): render specs and POST click
         bindings to /field/{col} with source=viewer so review widgets refresh.

         Click → field write can OOB-replace this container (highlight restyle).
         Attach plotly_click only after Plotly.react resolves, and serialize
         multi-field posts so overlapping OOB swaps do not drop the handler. */
      (function () {
        function parseJsonScript(root, cls) {
          var el = root.querySelector("script." + cls);
          if (!el) return null;
          try { return JSON.parse(el.textContent || "null"); }
          catch (e) { return null; }
        }

        function resolvePath(obj, path) {
          if (!path) return undefined;
          var parts = String(path).split(".");
          var cur = obj;
          for (var i = 0; i < parts.length; i++) {
            if (cur == null) return undefined;
            cur = cur[parts[i]];
          }
          return cur;
        }

        function postField(column, value) {
          return new Promise(function (resolve) {
            if (!column || typeof htmx === "undefined") {
              resolve();
              return;
            }
            var vals = {};
            vals[column] = value == null ? "" : value;
            vals.source = "viewer";
            var settled = false;
            function done() {
              if (settled) return;
              settled = true;
              document.removeEventListener("htmx:afterSettle", onSettle);
              resolve();
            }
            function onSettle() { done(); }
            document.addEventListener("htmx:afterSettle", onSettle);
            /* Fallback if afterSettle never fires (network / HTMX error). */
            setTimeout(done, 4000);
            htmx.ajax("POST", "/field/" + encodeURIComponent(column), {
              values: vals,
              target: "#status-bar",
              swap: "innerHTML"
            });
          });
        }

        function postFieldsSequential(updates) {
          var chain = Promise.resolve();
          updates.forEach(function (pair) {
            chain = chain.then(function () {
              return postField(pair.column, pair.value);
            });
          });
          return chain;
        }

        function watchPlotSize(container, target) {
          /* Opt-in via size.observe in _referia.yml (default true). Plotly
             responsive:true tracks window resize; the splitter only changes
             column width, so we call Plots.resize when the pane box changes. */
          if (container.getAttribute("data-size-observe") === "0") return;
          if (typeof ResizeObserver === "undefined") return;
          if (container._plotlyRo) return;
          var scheduled = null;
          var ro = new ResizeObserver(function () {
            if (scheduled !== null) cancelAnimationFrame(scheduled);
            scheduled = requestAnimationFrame(function () {
              scheduled = null;
              if (!target.isConnected || typeof Plotly === "undefined") return;
              try { Plotly.Plots.resize(target); } catch (err) {}
            });
          });
          /* Observe the column too — --viewer-pct changes its width. */
          var pane = container.closest(".viewer-col");
          if (pane) ro.observe(pane);
          ro.observe(container);
          container._plotlyRo = ro;
        }

        function resizeAllPlots() {
          if (typeof Plotly === "undefined") return;
          document.querySelectorAll(".viewer-plotly .plotly-target").forEach(
            function (t) {
              try { Plotly.Plots.resize(t); } catch (err) {}
            }
          );
        }
        window.referiaResizePlotly = resizeAllPlots;

        function schedulePlotResize(target) {
          /* After CSS / splitter layout settles (width × aspect-ratio). */
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (!target || !target.isConnected || typeof Plotly === "undefined") {
                return;
              }
              try { Plotly.Plots.resize(target); } catch (err) {}
            });
          });
        }

        function layoutForReact(container, fig) {
          /* container mode: keep autosize and never pin width/height — those
             freeze Plots.resize / splitter updates. figure mode: honor JSON. */
          var layout = Object.assign({}, (fig && fig.layout) || {});
          if (container.getAttribute("data-size-mode") === "container") {
            delete layout.width;
            delete layout.height;
            layout.autosize = true;
          }
          return layout;
        }

        function attachClickHandler(container, target, bindings) {
          if (typeof target.removeAllListeners === "function") {
            target.removeAllListeners("plotly_click");
          }
          target.on("plotly_click", function (ev) {
            if (!ev || !ev.points || !ev.points.length) return;
            var pt = ev.points[0];
            var payload = {
              customdata: pt.customdata,
              pointNumber: pt.pointNumber,
              curveNumber: pt.curveNumber,
              x: pt.x,
              y: pt.y
            };
            var updates = [];
            for (var i = 0; i < bindings.length; i++) {
              var action = bindings[i];
              if (!action || !action.set_field) continue;
              var val = resolvePath(payload, action.from);
              if (val === undefined) continue;
              if (typeof val === "object") {
                try { val = JSON.stringify(val); }
                catch (e) { val = String(val); }
              }
              updates.push({column: action.set_field, value: val});
            }
            var hl = container.getAttribute("data-highlight-field");
            if (hl) {
              updates.sort(function (a, b) {
                if (a.column === hl) return 1;
                if (b.column === hl) return -1;
                return 0;
              });
            }
            postFieldsSequential(updates);
          });
        }

        function reactPlot(container, target, fig, bindings, opts) {
          opts = opts || {};
          var bindGen = String(Date.now()) + "-" + Math.random();
          container.dataset.plotlyBindGen = bindGen;
          var layout = layoutForReact(container, fig);
          var data = (fig && fig.data) || [];
          var frames = (fig && fig.frames) || [];
          /* Plotly.react(data, layout) drops frames; Play/Pause needs addFrames. */
          var chain = Plotly.react(target, data, layout, {responsive: true});
          if (typeof Plotly.deleteFrames === "function") {
            chain = chain.then(function () { return Plotly.deleteFrames(target); });
          }
          if (frames.length && typeof Plotly.addFrames === "function") {
            chain = chain.then(function () { return Plotly.addFrames(target, frames); });
          }
          return chain.then(function () {
            if (
              !container.isConnected ||
              container.dataset.plotlyBindGen !== bindGen
            ) {
              return;
            }
            try { Plotly.Plots.resize(target); } catch (err) {}
            schedulePlotResize(target);
            if (opts.watch) watchPlotSize(container, target);
            if (opts.bindClick) attachClickHandler(container, target, bindings || []);
          });
        }

        function refreshPlot(container) {
          /* Spec script OOB-updated; restyle in place without remounting.
             Re-bind click handlers so Propose-split plane swaps stay interactive. */
          if (!container || typeof Plotly === "undefined") return;
          var target = container.querySelector(".plotly-target");
          var fig = parseJsonScript(container, "plotly-spec");
          var bindings = parseJsonScript(container, "plotly-bindings") || [];
          if (!target || !fig) return;
          reactPlot(container, target, fig, bindings, {
            watch: false,
            bindClick: true
          });
        }

        function maybeRefreshFromSpec(container) {
          if (!container || container.dataset.plotlyBound !== "1") return;
          var specEl = container.querySelector("script.plotly-spec");
          if (!specEl) return;
          var sig = specEl.textContent || "";
          if (container.dataset.plotlySpecSig === sig) return;
          container.dataset.plotlySpecSig = sig;
          refreshPlot(container);
        }

        function bindPlot(container) {
          if (!container || container.dataset.plotlyBound === "1") return;
          if (typeof Plotly === "undefined") return;
          var target = container.querySelector(".plotly-target");
          var fig = parseJsonScript(container, "plotly-spec");
          var bindings = parseJsonScript(container, "plotly-bindings") || [];
          if (!target || !fig) return;
          container.dataset.plotlyBound = "1";
          var specEl = container.querySelector("script.plotly-spec");
          if (specEl) container.dataset.plotlySpecSig = specEl.textContent || "";
          reactPlot(container, target, fig, bindings, {
            watch: true,
            bindClick: true
          });
        }

        function initPlots(root) {
          var scope = root || document;
          var nodes = scope.querySelectorAll
            ? scope.querySelectorAll(".viewer-plotly")
            : [];
          if (scope.classList && scope.classList.contains("viewer-plotly")) {
            bindPlot(scope);
          }
          Array.prototype.forEach.call(nodes, bindPlot);
        }

        document.addEventListener("DOMContentLoaded", function () {
          initPlots(document);
        });
        document.addEventListener("htmx:afterSettle", function (evt) {
          var el = (evt.detail && evt.detail.elt) ? evt.detail.elt : document;
          initPlots(el);
          initPlots(document);
          /* Highlight path OOBs only the plotly-spec script — refresh if changed. */
          document.querySelectorAll(".viewer-plotly").forEach(maybeRefreshFromSpec);
        });
      })();

      /* Resizable document / review split.  Ratio stored in localStorage and
         reapplied after HTMX swaps recreate .two-col inside #review-panel. */
      (function () {
        var KEY = "referia.split.viewerPct";
        var MIN = 20;
        var MAX = 80;

        function clampPct(pct) {
          if (isNaN(pct)) return 50;
          return Math.min(MAX, Math.max(MIN, pct));
        }

        var splitResizeRaf = null;
        function resizePlotsSoon() {
          if (splitResizeRaf !== null) return;
          splitResizeRaf = requestAnimationFrame(function () {
            splitResizeRaf = null;
            if (typeof window.referiaResizePlotly === "function") {
              window.referiaResizePlotly();
            }
          });
        }

        function applySplit(twoCol) {
          if (!twoCol) return;
          var stored = parseFloat(localStorage.getItem(KEY) || "50");
          twoCol.style.setProperty("--viewer-pct", clampPct(stored) + "%");
          resizePlotsSoon();
        }

        function bindSplitter(twoCol) {
          var handle = twoCol.querySelector(".col-splitter");
          if (!handle || handle.dataset.splitBound === "1") return;
          handle.dataset.splitBound = "1";
          handle.addEventListener("pointerdown", function (e) {
            if (window.matchMedia("(max-width: 900px)").matches) return;
            if (e.button !== undefined && e.button !== 0) return;
            e.preventDefault();
            handle.setPointerCapture(e.pointerId);
            twoCol.classList.add("is-resizing");

            function onMove(ev) {
              var rect = twoCol.getBoundingClientRect();
              if (rect.width <= 0) return;
              var pct = clampPct(((ev.clientX - rect.left) / rect.width) * 100);
              twoCol.style.setProperty("--viewer-pct", pct + "%");
              try { localStorage.setItem(KEY, String(pct)); } catch (err) {}
              resizePlotsSoon();
            }

            function onUp(ev) {
              twoCol.classList.remove("is-resizing");
              try { handle.releasePointerCapture(ev.pointerId); } catch (err) {}
              handle.removeEventListener("pointermove", onMove);
              handle.removeEventListener("pointerup", onUp);
              handle.removeEventListener("pointercancel", onUp);
              resizePlotsSoon();
            }

            handle.addEventListener("pointermove", onMove);
            handle.addEventListener("pointerup", onUp);
            handle.addEventListener("pointercancel", onUp);
          });
        }

        function initSplit(root) {
          var scope = root && root.querySelector ? root : document;
          var twoCol = scope.classList && scope.classList.contains("two-col")
            ? scope
            : scope.querySelector(".two-col");
          if (!twoCol) return;
          applySplit(twoCol);
          bindSplitter(twoCol);
        }

        document.addEventListener("DOMContentLoaded", function () {
          initSplit(document);
        });
        document.addEventListener("htmx:afterSettle", function (evt) {
          var el = (evt.detail && evt.detail.elt) ? evt.detail.elt : document;
          initSplit(el);
        });
      })();

      /* Keep <details> open/closed across HTMX index swaps — PDFs on the
         left (pdf-entry / data-doc-key) and review-form sections on the
         right (review-section / data-section-key). */
      (function () {
        function persistDetails(selector, className, storageKey, dataAttr) {
          function readMap() {
            try {
              return JSON.parse(sessionStorage.getItem(storageKey) || "{}") || {};
            } catch (err) {
              return {};
            }
          }

          function writeMap(map) {
            try { sessionStorage.setItem(storageKey, JSON.stringify(map)); } catch (err) {}
          }

          function nodeKey(details) {
            return details.getAttribute(dataAttr) || "";
          }

          function collect(root) {
            var scope = root && root.querySelectorAll ? root : document;
            if (scope.classList && scope.classList.contains(className)) {
              return [scope];
            }
            return scope.querySelectorAll(selector);
          }

          function applyOpenState(root) {
            var map = readMap();
            Array.prototype.forEach.call(collect(root), function (d) {
              var k = nodeKey(d);
              if (k && map[k]) d.open = true;
            });
          }

          function bindToggles(root) {
            Array.prototype.forEach.call(collect(root), function (d) {
              if (d.dataset.openBound === "1") return;
              d.dataset.openBound = "1";
              d.addEventListener("toggle", function () {
                var k = nodeKey(d);
                if (!k) return;
                var map = readMap();
                if (d.open) map[k] = true;
                else delete map[k];
                writeMap(map);
              });
            });
          }

          function init(root) {
            applyOpenState(root);
            bindToggles(root);
          }

          document.addEventListener("DOMContentLoaded", function () {
            init(document);
          });
          document.addEventListener("htmx:afterSettle", function (evt) {
            var el = (evt.detail && evt.detail.elt) ? evt.detail.elt : document;
            init(el);
          });
        }

        persistDetails(
          "details.pdf-entry", "pdf-entry",
          "referia.pdfEntry.open", "data-doc-key"
        );
        persistDetails(
          "details.review-section", "review-section",
          "referia.reviewSection.open", "data-section-key"
        );
        persistDetails(
          "details.viewer-heading-collapse", "viewer-heading-collapse",
          "referia.viewerHeading.open", "data-section-key"
        );
      })();

      /* Keep left viewer + window scroll across HTMX #review-panel swaps
         (record change, reload).  .viewer-col scrolls independently;
         the review form uses window/page scroll. */
      (function () {
        var pending = null;

        function isReviewPanelTarget(target) {
          return !!(target && target.id === "review-panel");
        }

        function capture() {
          var viewer = document.querySelector(".viewer-col");
          return {
            viewer: viewer ? viewer.scrollTop : 0,
            window: window.scrollY || document.documentElement.scrollTop || 0
          };
        }

        function clamp(el, value) {
          var max = 0;
          if (el === window) {
            max = Math.max(
              0,
              (document.documentElement.scrollHeight || 0) - window.innerHeight
            );
          } else if (el) {
            max = Math.max(0, el.scrollHeight - el.clientHeight);
          }
          if (isNaN(value) || value < 0) return 0;
          return Math.min(value, max);
        }

        function restore(pos) {
          if (!pos) return;
          var viewer = document.querySelector(".viewer-col");
          if (viewer) viewer.scrollTop = clamp(viewer, pos.viewer || 0);
          window.scrollTo(0, clamp(window, pos.window || 0));
        }

        document.addEventListener("htmx:beforeSwap", function (evt) {
          if (!evt.detail || !isReviewPanelTarget(evt.detail.target)) return;
          pending = capture();
        });

        document.addEventListener("htmx:afterSettle", function () {
          if (!pending) return;
          var pos = pending;
          pending = null;
          /* Double rAF: run after sticky-height / MathJax layout in other
             afterSettle handlers. */
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              restore(pos);
            });
          });
        });
      })();
    </script>
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">{{ title }}</h1>
        <div class="site-meta">
            <span class="meta-label">Config:</span>
            <span class="meta-value">{{ config }}</span>
        </div>
    </header>

    <main id="main-content">
        <div id="review-panel">
            {% block content %}
            {% include "review_panel.html" %}
            {% endblock %}
        </div>
    </main>

    <div id="status-bar" class="status-bar" role="status" aria-live="polite"></div>
</body>
</html>
